[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "omniarch-pt"
version = "0.3.0"
description = "OmniArch (智算天璇) in PyTorch: a 1D/2D/3D unified PDE foundation model you can run on a laptop"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
  "torch>=2.1",
  "numpy",
  "matplotlib",
  "fastapi",
  "uvicorn",
  "python-multipart",
]

[project.optional-dependencies]
data = ["h5py"]

[project.scripts]
omniarch = "omniarch.cli:main"

[tool.setuptools]
packages = ["omniarch"]

[tool.setuptools.package-data]
omniarch = ["static/*.html"]
